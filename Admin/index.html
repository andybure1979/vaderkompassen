<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Väderkompassen driftstatus</title><style>body{font-family:system-ui;margin:0;background:#f3f6f8;color:#17212b}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:white;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #0001}input,button{font:inherit;padding:11px;border-radius:10px;border:1px solid #ccd5dc}button{cursor:pointer;font-weight:700}pre{white-space:pre-wrap;word-break:break-word}.ok{color:#087a42}.bad{color:#b42318}</style></head><body><main class="wrap"><h1>Väderkompassen driftstatus</h1><div class="card"><label>Worker-adress <input id="base" size="45" value="https://vaderkompassen.andreas-bure.workers.dev"></label> <button id="load">Hämta status</button></div><div id="summary" class="card">Ingen kontroll gjord.</div><div class="card"><h2>Senaste körningar</h2><pre id="runs">–</pre></div></main><script>const $=id=>document.getElementById(id);async function load(){const b=$('base').value.replace(/\/$/,'');$('summary').textContent='Hämtar…';try{const r=await fetch(b+'/v1/status',{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error(j.error||r.status);$('summary').innerHTML=`<strong class="ok">API fungerar</strong><br>Version: ${j.version}<br>Senaste snapshot: ${j.latestSnapshot?.generated_at||'Ingen sparad ännu'}<br>Serverns tid: ${j.time}`;$('runs').textContent=JSON.stringify(j.recentRuns,null,2)}catch(e){$('summary').innerHTML=`<strong class="bad">Fel</strong><br>${e.message}`}}$('load').onclick=load;load();</script></body></html>
