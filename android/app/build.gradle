apply plugin: 'com.android.application'

def signingValue = { String propertyName, String legacyEnvironmentName ->
    providers.gradleProperty(propertyName).orElse(providers.environmentVariable(propertyName)).orElse(providers.environmentVariable(legacyEnvironmentName)).orNull
}
def releaseKeystorePath = signingValue('VADERKOMPASSEN_UPLOAD_STORE_FILE', 'VK_ANDROID_KEYSTORE_PATH')
def releaseStorePassword = signingValue('VADERKOMPASSEN_UPLOAD_STORE_PASSWORD', 'VK_ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = signingValue('VADERKOMPASSEN_UPLOAD_KEY_ALIAS', 'VK_ANDROID_KEY_ALIAS')
def releaseKeyPassword = signingValue('VADERKOMPASSEN_UPLOAD_KEY_PASSWORD', 'VK_ANDROID_KEY_PASSWORD')
def releaseSigningComplete = [releaseKeystorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }
def admobAppId = providers.gradleProperty('VADERKOMPASSEN_ADMOB_ANDROID_APP_ID').orElse(providers.environmentVariable('VK_ADMOB_ANDROID_APP_ID')).orElse('').get()

android {
    namespace = "se.vaderkompassen.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "se.vaderkompassen.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 15008
        versionName "15.0.6"
        manifestPlaceholders = [admobAppId: admobAppId, admobEnabled: !admobAppId.isBlank()]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningComplete) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningComplete) signingConfig signingConfigs.release
        }
    }
}

tasks.register('verifyReleaseSigning') {
    doLast {
        if (!releaseSigningComplete) throw new GradleException('Signerad AAB kräver VADERKOMPASSEN_UPLOAD_STORE_FILE, VADERKOMPASSEN_UPLOAD_STORE_PASSWORD, VADERKOMPASSEN_UPLOAD_KEY_ALIAS och VADERKOMPASSEN_UPLOAD_KEY_PASSWORD i ~/.gradle/gradle.properties eller miljön.')
        if (!file(releaseKeystorePath).isFile()) throw new GradleException('Konfigurerad upload-keystore finns inte.')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "com.android.billingclient:billing:9.1.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
